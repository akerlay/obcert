name: obcert
options:
  bundleIdPrefix: me.obcert
  deploymentTarget:
    macOS: "13.0"
packages:
  CheburcertCore:
    path: ../..
targets:
  obcert:
    type: application
    platform: macOS
    sources:
      - path: .
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: CheburcertCore
        product: CheburcertCore
    settings:
      base:
        PRODUCT_NAME: obcert
        MARKETING_VERSION: "1.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: obcert.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        LSMinimumSystemVersion: "13.0"
        CFBundleDisplayName: obcert
        CFBundleName: obcert
